<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI Breakdown — Paperwork Monster</title>
<style>
  :root{
    --mint:#f7fff7; --teal:#1a535c; --teal-700:#0f3036; --green:#519843; --green-600:#427a37;
    --pink:#ff6b6b; --coffee:#644536; --bg:#f7fff7; --raised:#fff; --sunken:#ecf6ec;
    --fg:#1a535c; --muted:rgba(26,83,92,.72); --subtle:rgba(26,83,92,.55);
    --border:rgba(100,69,54,.16); --border-strong:rgba(100,69,54,.32);
    --radius:12px; --shadow:0 4px 8px rgba(100,69,54,.08),0 2px 4px rgba(100,69,54,.04);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --head:"Nunito",system-ui,-apple-system,sans-serif;
    --sidebar:340px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--fg);background:var(--bg);font-size:15px;line-height:1.55}
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh}
  /* Sidebar */
  aside{background:var(--raised);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-family:var(--head);font-weight:800;display:grid;place-items:center;font-size:17px}
  .brand b{font-family:var(--head);font-weight:800;font-size:16px;color:var(--teal-700)}
  .brand small{display:block;color:var(--subtle);font-weight:600;font-size:11px;letter-spacing:.04em}
  .search{padding:12px 14px;flex-shrink:0}
  .search input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:999px;font:inherit;font-size:13px;background:var(--sunken);color:var(--fg)}
  .search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(81,152,67,.18)}
  .tree{overflow:auto;padding:4px 8px 40px;flex:1;min-height:0}
  .grp{font-family:var(--head);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-600);padding:14px 10px 6px}
  .node{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node:hover{background:var(--sunken)}
  .node.on{background:var(--green);color:#fff}
  .node.on .pill{background:rgba(255,255,255,.25);color:#fff}
  .node .pill{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--sunken);color:var(--muted)}
  .pill.island{background:#e8f1f2;color:#144048}
  .pill.static{background:#ecf5e9;color:var(--green-600)}
  .pill.page{background:#fff1f1;color:#c92a2a}
  .pg{margin:1px 0}
  .pg>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13.5px}
  .pg>summary::-webkit-details-marker{display:none}
  .pg>summary:hover{background:var(--sunken)}
  .pg>summary .chev{transition:transform .15s;color:var(--subtle);font-size:11px}
  .pg[open]>summary .chev{transform:rotate(90deg)}
  .pg .kids{margin-left:14px;border-left:1px solid var(--border);padding-left:6px}
  .hidden{display:none!important}
  /* Main */
  main{overflow:auto;min-height:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(247,255,247,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 28px}
  .crumb{font-size:12px;color:var(--subtle);font-weight:600}
  .title{font-family:var(--head);font-weight:800;font-size:22px;color:var(--teal-700);margin:2px 0 0;display:flex;align-items:center;gap:10px}
  .tabs{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
  .tab{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab .n{opacity:.6;font-weight:600}
  .content{padding:24px 32px 80px;max-width:980px}
  /* Markdown */
  .md h1,.md h2,.md h3,.md h4{font-family:var(--head);color:var(--teal-700);line-height:1.2;margin:1.4em 0 .5em;text-wrap:balance}
  .md h1{font-size:30px;margin-top:0}.md h2{font-size:23px;border-bottom:1px solid var(--border);padding-bottom:.25em}
  .md h3{font-size:18px}.md h4{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-600)}
  .md p{margin:.6em 0}.md ul,.md ol{margin:.5em 0;padding-left:1.4em}.md li{margin:.25em 0}
  .md a{color:var(--green-600);text-decoration:underline}
  .md code{font-family:var(--mono);font-size:.86em;background:var(--sunken);padding:.12em .4em;border-radius:5px;color:var(--teal-700)}
  .md pre{background:#0f3036;color:#e8f1f2;padding:14px 16px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5}
  .md pre code{background:none;color:inherit;padding:0}
  .md blockquote{margin:.7em 0;padding:.4em 1em;border-left:3px solid var(--green);background:var(--sunken);border-radius:0 8px 8px 0;color:var(--muted)}
  .md table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13px}
  .md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .md th{background:var(--sunken);font-family:var(--head);font-weight:800;color:var(--teal-700)}
  .md tr:nth-child(even) td{background:rgba(236,246,236,.4)}
  .md hr{border:none;border-top:1px solid var(--border);margin:1.4em 0}
  .code-view{background:#0f3036;color:#e8f1f2;padding:18px 20px;border-radius:12px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre;tab-size:2}
  .casegrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .casebtn{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--raised);font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
  .casebtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  .empty{color:var(--subtle);font-style:italic;padding:30px 0}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
  .stat{font-size:12px;color:var(--subtle);padding:10px 14px}
  @media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:84%;max-width:340px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}aside.open{transform:none}.menu-btn{display:inline-grid!important}}
  .menu-btn{display:none;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--raised);cursor:pointer;font-size:16px;margin-right:8px}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="mark">P</span>
      <div><b>UI Breakdown</b><small>Paperwork Monster · build spec</small></div>
    </div>
    <div class="search"><input id="q" placeholder="Filter pages & components…" /></div>
    <nav class="tree" id="tree"></nav>
    <div class="stat" id="stat"></div>
  </aside>
  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="menu-btn" id="menu">☰</button>
        <div style="flex:1">
          <div class="crumb" id="crumb">—</div>
          <div class="title" id="title">Select an item</div>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<script src="viewer-data.js"></script>
<script>
const D = window.UIB;
if(!D){document.getElementById('content').innerHTML='<p class="empty">viewer-data.js failed to load. Open viewer.html from the ui-breakdown folder (keep it next to viewer-data.js).</p>';}

/* ---------- tiny markdown renderer (headings, tables, lists, code, inline) ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  // protect inline code, then bold/italic/links on escaped text
  let parts=[], i=0;
  s=s.replace(/`([^`]+)`/g,(m,c)=>{parts.push('<code>'+esc(c)+'</code>');return '␀'+(parts.length-1)+'␀';});
  s=esc(s);
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/␀(\d+)␀/g,(m,n)=>parts[+n]);
  return s;
}
function md2html(src){
  if(src==null) return '<p class="empty">— none —</p>';
  const L=src.replace(/\r/g,'').split('\n'); let H='',i=0;
  while(i<L.length){
    let ln=L[i];
    if(/^```/.test(ln)){ // fenced code
      let lang=ln.slice(3).trim(),buf=[];i++;
      while(i<L.length && !/^```/.test(L[i])){buf.push(L[i]);i++;}
      i++; H+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<L.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1]) && L[i+1].includes('-')){
      // GFM table
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(ln); i+=2; let body=[];
      while(i<L.length && /^\s*\|.*\|\s*$/.test(L[i])){body.push(row(L[i]));i++;}
      H+='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
         body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){H+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';i++;continue;}
    if(/^\s*([-*_])\1\1+\s*$/.test(ln)){H+='<hr>';i++;continue;}
    if(/^\s*>/.test(ln)){let buf=[];while(i<L.length&&/^\s*>/.test(L[i])){buf.push(L[i].replace(/^\s*>\s?/,''));i++;}H+='<blockquote>'+md2html(buf.join('\n'))+'</blockquote>';continue;}
    if(/^\s*[-*+]\s+/.test(ln)){let buf=[];while(i<L.length&&/^\s*[-*+]\s+/.test(L[i])){buf.push('<li>'+inline(L[i].replace(/^\s*[-*+]\s+/,''))+'</li>');i++;}H+='<ul>'+buf.join('')+'</ul>';continue;}
    if(/^\s*\d+\.\s+/.test(ln)){let buf=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){buf.push('<li>'+inline(L[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;}H+='<ol>'+buf.join('')+'</ol>';continue;}
    if(/^\s*$/.test(ln)){i++;continue;}
    let buf=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+\.\s|\s*>)/.test(L[i])&&!/^\s*\|.*\|\s*$/.test(L[i])){buf.push(L[i]);i++;}
    H+='<p>'+inline(buf.join('\n'))+'</p>';
  }
  return H;
}

/* ---------- build node registry + tree ---------- */
const NODES={}; let idc=0;
function reg(n){const id='n'+(idc++);NODES[id]=n;return id;}
function classify(spec){
  if(!spec) return '';
  const m=spec.match(/bucket[^a-z]*?(island|page-composition|static)/i)||spec.match(/\b(island|page-composition|static)\b/i);
  return m?m[1].toLowerCase().replace('page-composition','page'):'';
}
const tree=document.getElementById('tree');
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

function compNode(c,page){
  const tier=classify(c.spec);
  const id=reg({type:'component',title:c.component||c.name,page,data:c,tier});
  const n=el('div','node');n.dataset.id=id;n.dataset.search=(c.name+' '+(c.component||'')).toLowerCase();
  n.innerHTML='<span>'+c.name+'</span>'+(tier?'<span class="pill '+tier+'">'+tier+'</span>':'');
  n.onclick=()=>select(id);
  return n;
}

function build(){
  // Overview
  tree.appendChild(el('div','grp','Overview'));
  D.overview.forEach(d=>{
    const id=reg({type:'doc',title:d.title,md:d.md});
    const n=el('div','node');n.dataset.id=id;n.dataset.search=d.title.toLowerCase();
    n.innerHTML='<span>📄 '+d.title+'</span>';n.onclick=()=>select(id);tree.appendChild(n);
  });
  // Shared
  tree.appendChild(el('div','grp','Shared components ('+D.shared.length+')'));
  D.shared.forEach(c=>tree.appendChild(compNode(c,'shared-components')));
  // Pages
  tree.appendChild(el('div','grp','Pages ('+D.pages.length+')'));
  D.pages.forEach(p=>{
    const det=el('details','pg');const sum=el('summary');
    sum.dataset.search=p.name.toLowerCase();
    sum.innerHTML='<span class="chev">▶</span><span>'+p.name+'</span><span class="pill">'+p.components.length+'</span>';
    det.appendChild(sum);
    const kids=el('div','kids');
    const pid=reg({type:'page',title:p.name,data:p});
    const pn=el('div','node');pn.dataset.id=pid;pn.dataset.search=p.name.toLowerCase();
    pn.innerHTML='<span>📄 '+p.name+'.md</span>';pn.onclick=e=>{e.stopPropagation();select(pid);};
    kids.appendChild(pn);
    p.components.forEach(c=>kids.appendChild(compNode(c,p.name)));
    det.appendChild(kids);tree.appendChild(det);
  });
  document.getElementById('stat').textContent=D.stats.pages+' pages · '+D.stats.shared+' shared · '+D.stats.components+' components · '+D.stats.cases+' cases';
}

/* ---------- render ---------- */
const crumb=document.getElementById('crumb'),titleEl=document.getElementById('title'),
      tabsEl=document.getElementById('tabs'),contentEl=document.getElementById('content');
let cur=null;
function setActive(id){document.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',n.dataset.id===id));}

function select(id){
  const node=NODES[id];cur=id;setActive(id);
  if(window.innerWidth<=760)document.getElementById('sidebar').classList.remove('open');
  if(node.type==='doc'){crumb.textContent='Overview';titleEl.textContent=node.title;tabsEl.innerHTML='';contentEl.className='content md';contentEl.innerHTML=md2html(node.md);contentEl.parentElement.scrollTop=0;return;}
  if(node.type==='page'){
    const p=node.data;crumb.textContent='Page';titleEl.textContent='/'+(p.name);
    tabsEl.innerHTML='';contentEl.className='content md';
    let h=md2html(p.pageMd);
    h+='<hr><h3>Components on this page ('+p.components.length+')</h3><ul>';
    p.components.forEach(c=>{h+='<li><a href="#" data-go="'+c.name+'">'+c.name+'</a> — '+(classify(c.spec)||'component')+'</li>';});
    h+='</ul>';contentEl.innerHTML=h;
    contentEl.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();const nm=a.dataset.go;const found=Object.keys(NODES).find(k=>NODES[k].type==='component'&&NODES[k].page===p.name&&NODES[k].data.name===nm);if(found)select(found);});
    contentEl.parentElement.scrollTop=0;return;
  }
  // component
  const c=node.data;
  crumb.textContent=node.page;
  titleEl.innerHTML=esc(c.component||c.name)+(node.tier?' <span class="pill '+node.tier+'" style="font-size:11px">'+node.tier+'</span>':'');
  const tabs=[];
  if(c.spec)tabs.push(['Spec',()=>{contentEl.className='content md';contentEl.innerHTML=md2html(c.spec);}]);
  if(c.fixture)tabs.push(['Fixture',()=>{contentEl.className='content';contentEl.innerHTML='<div class="code-view">'+esc(pretty(c.fixture))+'</div>';}]);
  if(c.cases&&c.cases.length)tabs.push(['Cases '+'('+c.cases.length+')',()=>renderCases(c)]);
  if(c.css)tabs.push(['CSS',()=>{contentEl.className='content';contentEl.innerHTML='<div class="chip">'+esc(c.cssName||'')+'</div><div class="code-view" style="margin-top:8px">'+esc(c.css)+'</div>';}]);
  if(c.source)tabs.push(['Source',()=>{contentEl.className='content';contentEl.innerHTML='<div class="chip">'+esc(c.sourceName||'')+' (reference)</div><div class="code-view" style="margin-top:8px">'+esc(c.source)+'</div>';}]);
  if(c.checklist)tabs.push(['Capture',()=>{contentEl.className='content md';contentEl.innerHTML=md2html(c.checklist);}]);
  tabsEl.innerHTML='';
  tabs.forEach((t,k)=>{const b=el('button','tab'+(k===0?' on':''));b.innerHTML=t[0];b.onclick=()=>{tabsEl.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');t[1]();contentEl.parentElement.scrollTop=0;};tabsEl.appendChild(b);});
  if(tabs.length)tabs[0][1](); else {contentEl.className='content';contentEl.innerHTML='<p class="empty">No artifacts.</p>';}
  contentEl.parentElement.scrollTop=0;
}
function pretty(s){try{return JSON.stringify(JSON.parse(s),null,2);}catch(e){return s;}}
function renderCases(c){
  contentEl.className='content';
  let h='<div class="casegrid">'+c.cases.map((cs,k)=>'<button class="casebtn'+(k===0?' on':'')+'" data-k="'+k+'">'+esc(cs.name.replace(/\.json$/,''))+'</button>').join('')+'</div>';
  h+='<div id="caseout" class="code-view">'+esc(pretty(c.cases[0].content))+'</div>';
  contentEl.innerHTML=h;
  contentEl.querySelectorAll('.casebtn').forEach(b=>b.onclick=()=>{contentEl.querySelectorAll('.casebtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('caseout').textContent=pretty(c.cases[+b.dataset.k].content);});
}

/* ---------- search filter ---------- */
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  document.querySelectorAll('.tree .node').forEach(n=>{n.classList.toggle('hidden',!!q&&!(n.dataset.search||'').includes(q));});
  document.querySelectorAll('.tree .pg').forEach(p=>{
    const sumMatch=(p.querySelector('summary').dataset.search||'').includes(q);
    const kidMatch=[...p.querySelectorAll('.node')].some(n=>!n.classList.contains('hidden'));
    p.classList.toggle('hidden',!!q&&!sumMatch&&!kidMatch);
    if(q&&kidMatch)p.open=true;
  });
});
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

build();
// open first overview doc
const first=Object.keys(NODES).find(k=>NODES[k].type==='doc');
if(first)select(first);
</script>
</body>
</html>
